<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사진 · 질문과 답변 | H:ARCHIVE</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="community.css"><link rel="icon" href="favicon.svg"></head>
<body><header><a class="brand" href="index.html">H:ARCHIVE</a><a href="index.html">예산 서재로 돌아가기</a></header><main>
<p class="eyebrow">PHOTO & CONVERSATION</p><h1>사진과 이야기, 질문과 답변</h1><p>사진을 둘러보고 궁금한 점을 남겨주세요.</p>
<p id="connection" role="status"></p>
<section class="panel"><div class="section-top"><h2>사진 기록</h2><button id="uploadOpen" hidden>사진 올리기</button></div><p class="hint">사진 보기를 누르면 압축 사진을 불러옵니다.</p><div id="photos" class="photo-grid"></div><button id="photosMore" hidden>이전 사진 더 보기</button></section>
<section class="panel"><div class="section-top"><h2>질문과 답변</h2><button id="refresh">새로고침</button></div><p class="hint">질문과 답변은 누구나 볼 수 있습니다. 연락처와 개인정보를 쓰지 마세요.</p><form id="questionForm"><label>이름 또는 별명<input name="name" maxlength="30" required autocomplete="nickname"></label><label>질문<textarea name="question" rows="4" maxlength="2000" required></textarea></label><button class="dark" type="submit">질문 남기기</button></form><div id="questions"></div><button id="questionsMore" hidden>이전 질문 더 보기</button></section>
<details class="panel"><summary>관리자</summary><p id="authState">사진 등록과 답변 작성은 관리자 로그인 후 가능합니다.</p><form id="loginForm"><label>이메일<input name="email" type="email" required autocomplete="username"></label><label>비밀번호<input name="password" type="password" required autocomplete="current-password"></label><button type="submit">로그인</button></form><button id="logout" hidden>로그아웃</button></details>
</main><dialog id="uploadDialog"><form id="uploadForm"><div class="dialog-head"><h2>사진 올리기</h2><button type="button" id="uploadClose" aria-label="닫기">✕</button></div><label>사진 제목<input name="title" maxlength="100" required></label><label>사진 파일<input id="photoFile" type="file" accept="image/jpeg,image/png,image/webp" required></label><label>저장 품질<select id="compression"><option value="50">최소 용량 · 50KB 이하</option><option value="100">균형 · 100KB 이하</option></select></label><p class="hint">원본은 전송하지 않습니다. 최대 1,280px로 줄이고 메타데이터를 제거합니다. 투명 부분은 흰색으로 저장됩니다.</p><img id="preview" alt="압축 결과 미리보기" hidden><p id="sizeInfo" role="status"></p><button id="uploadSubmit" class="dark" type="submit" disabled>압축본 저장</button></form></dialog><p id="message" role="status" aria-live="polite"></p><script type="module" src="community.js"></script></body></html>
